<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,"> <!-- Prevent favicon 404 error -->
    <title>Video Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-gray-800 text-white h-screen flex flex-col">
    <!-- Menu Bar -->
    <div class="menu-bar flex items-center p-4 bg-gray-900">
        <h3 class="text-xl font-bold">Video Editor</h3>
    </div>

    <!-- Main Content -->
    <div class="flex flex-1 overflow-hidden">
        <!-- Left Toolbar -->
        <div class="left-toolbar flex flex-col items-center p-4 bg-gray-700">
            <button class="p-2 rounded-lg hover:bg-gray-600 tool-btn" title="Crop Tool" id="cropToolButton">
                <i class="fas fa-crop"></i>
            </button>
        </div>

        <!-- Video Preview and Timeline -->
        <div class="flex-1 flex flex-col">
            <!-- Video Preview -->
            <div class="video-preview flex-1 flex items-center justify-center relative bg-gray-900">
                <input type="file" id="videoUpload" accept="video/*"
                    class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                <video id="videoElement" class="hidden w-full h-full" controls></video>
                <div class="overlay absolute inset-0 flex items-center justify-center bg-black bg-opacity-50"
                    id="uploadPrompt">
                    <button id="uploadButton" class="text-center bg-transparent border-none cursor-pointer">
                        <i class="fas fa-video text-4xl text-gray-500 mb-2"></i>
                        <p class="text-gray-400">Upload Video</p>
                    </button>
                </div>
            </div>

            <!-- Timeline -->
            <div class="timeline p-4 bg-gray-700">
                <div class="controls flex items-center mb-4">
                    <button class="px-3 py-1 bg-blue-600 rounded mr-2" id="playPauseButton">
                        <i class="fas fa-play"></i>
                    </button>
                    <div class="progress-bar flex-1 bg-gray-600 h-2 rounded cursor-pointer relative">
                        <div class="progress bg-blue-600 h-full w-0 rounded"></div>
                    </div>
                    <span class="ml-2 text-sm" id="timeDisplay">00:00:00 / 00:00:00</span>
                </div>

                <div class="timeline-track bg-gray-600 h-2 rounded mb-1"></div>
                <div class="timeline-track bg-gray-600 h-2 rounded mb-1"></div>
                <div class="timeline-track bg-gray-600 h-2 rounded"></div>
            </div>
        </div>

        <!-- Right Panel -->
        <div class="right-panel p-4 bg-gray-700">
            <div class="mb-4">
                <h3 class="font-bold mb-2">Media</h3>
                <div class="space-y-2">
                    <div class="media-item flex items-center p-2 bg-gray-600 rounded">
                        <i class="fas fa-video mr-2 text-blue-400"></i>
                        <span id="videoFileName">No video uploaded</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="scripts.js"></script>
</body>

</html>
